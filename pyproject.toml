[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rosa-compute"
version = "0.1.0"
description = "ROSA Compute Research Repository"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "zcomputerwiz" }
]
dependencies = [
    "torch",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "cuda: tests requiring CUDA execution",
    "integration: full layer or integration tests",
    "slow: tests that take longer to run",
    "checkpoint: tests requiring ROSA checkpoint loading",
    "exp0: tests for Experiment 0 apparatus and models",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["external"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/rosa_compute/rosa_compat.py" = ["E402"]
