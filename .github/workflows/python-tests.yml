name: CPU Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # These jobs are CPU-only. Installing Torch from its CPU wheel index
          # avoids downloading the multi-gigabyte CUDA/NVIDIA dependency stack;
          # the subsequent editable install sees Torch as already satisfied.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run ROSA compatibility tests
        run: |
          pytest -m "not cuda and not checkpoint and not slow and not exp0" -v

      - name: Run Experiment 0 tests
        if: always()
        run: |
          pytest -m "exp0 and not cuda and not slow" -v
