name: CUDA Tests (Self-Hosted)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'

jobs:
  test-cuda:
    # Requires self-hosted runner with NVIDIA GPU & CUDA environment configured
    runs-on: [self-hosted, GPU]
    if: false  # Disabled by default until self-hosted GPU runner is configured
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies & build rosa_soft CUDA
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
          cd external/rosa_soft && pip install -e .

      - name: Run CUDA Pytest
        run: |
          pytest -m "cuda" -v
