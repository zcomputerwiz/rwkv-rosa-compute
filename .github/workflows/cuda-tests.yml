name: CUDA Tests (Self-Hosted)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'

jobs:
  test-cuda:
    runs-on: [self-hosted, GPU]
    if: false  # Disabled until self-hosted GPU runner is configured
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies & build rosa_soft CUDA extension
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
          cd external/rosa_soft && USE_CUDA=1 pip install -e .

      - name: Verify CUDA Extension Capabilities
        run: |
          python -c "import rosa_soft; caps = rosa_soft.BUILD_CAPABILITIES; print(caps); assert caps.rosa_soft_cuda, 'CUDA extension not built!'"

      - name: Run CUDA Pytest
        run: |
          pytest -m "cuda" -v
